name: Auto Scrape Berita ATR/BPN

on:
  schedule:
    # Jalan otomatis setiap hari pukul 01:00 UTC (08:00 WIB)
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      target_month:
        description: "Bulan (MM), kosongkan untuk bulan berjalan"
        required: false
        default: ""
      target_year:
        description: "Tahun (YYYY), kosongkan untuk tahun berjalan"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install cloudscraper pandas

      - name: Run scraper
        env:
          TARGET_MONTH: ${{ github.event.inputs.target_month }}
          TARGET_YEAR: ${{ github.event.inputs.target_year }}
        run: python scrape.py

      - name: Commit and push updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add berita-*.csv
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada file CSV."
          else
            git commit -m "chore: update berita otomatis $(date -u +'%Y-%m-%d')"
            git push
          fi
