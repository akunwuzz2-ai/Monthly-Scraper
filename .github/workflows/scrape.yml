name: Auto Scrape Berita ATR/BPN

on:
  schedule:
    # Setiap hari pukul 01:00 UTC (08:00 WIB)
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      target_month:
        description: "Bulan (MM), kosongkan = bulan berjalan + bulan lalu"
        required: false
        default: ""
      target_year:
        description: "Tahun (YYYY), kosongkan = tahun berjalan"
        required: false
        default: ""

permissions:
  contents: write
  pages: write

concurrency:
  group: scrape-berita
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          TARGET_MONTH: ${{ github.event.inputs.target_month }}
          TARGET_YEAR: ${{ github.event.inputs.target_year }}
        run: python scrape.py

      # Berita daerah (Kantah Kab. Bintan). Kalau gagal, berita pusat tetap di-commit
      # karena langkah commit di bawah memakai `if: ${{ !cancelled() }}`.
      - name: Run scraper Kantah Bintan
        env:
          TARGET_MONTH: ${{ github.event.inputs.target_month }}
          TARGET_YEAR: ${{ github.event.inputs.target_year }}
        run: python scrape_bintan.py

      - name: Upload debug Bintan (jika gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-bintan
          path: debug-bintan.html
          if-no-files-found: ignore

      - name: Commit and push updated CSV
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # bersihkan file sisa dari versi lama yang salah nama
          git rm -f --ignore-unmatch "berita--.csv" || true
          git add berita-????-??.csv berita-bintan-????-??.csv
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada file CSV."
          else
            git commit -m "chore: update berita otomatis $(date -u +'%Y-%m-%d')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Trigger GitHub Pages build
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
